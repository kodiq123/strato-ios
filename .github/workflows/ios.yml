name: iOS

# Builds an unsigned TeleDrive.ipa for sideloading (AltStore / Sideloadly re-sign it with
# the user's Apple ID on install), then runs the iOS tests on a simulator.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "website/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # Intel runner: the arm64 macOS pool has had long capacity queues. Building for iPhone
    # (arm64) from an Intel Mac is a normal cross-compile.
    runs-on: macos-26-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Cache TDLibFramework
        uses: actions/cache@v4
        with:
          path: iosApp/Frameworks
          key: tdlib-${{ hashFiles('iosApp/scripts/fetch-tdlib.sh') }}

      - name: Fetch TDLibFramework
        run: bash iosApp/scripts/fetch-tdlib.sh

      - name: Generate Xcode project
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project iosApp/TeleDrive.xcodeproj \
            -scheme TeleDrive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 || { grep -E "error:|e: " build/xcodebuild.log | head -80; exit 1; }
          grep -E "\*\* BUILD" build/xcodebuild.log
          test -d build/ios/Build/Products/Release-iphoneos/TeleDrive.app

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/TeleDrive.app dist/Payload/
          cd dist && zip -qry TeleDrive-unsigned.ipa Payload
          ls -lh TeleDrive-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TeleDrive-unsigned-ipa
          path: dist/TeleDrive-unsigned.ipa
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: build/*.log
          if-no-files-found: ignore

  simulator-tests:
    # The AndroidX KMP libraries no longer publish iosX64, so simulator tests need an arm64 Mac.
    # Not blocking: when the arm64 pool is saturated the IPA above is still produced.
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Cache TDLibFramework
        uses: actions/cache@v4
        with:
          path: iosApp/Frameworks
          key: tdlib-${{ hashFiles('iosApp/scripts/fetch-tdlib.sh') }}

      - name: Fetch TDLibFramework
        run: bash iosApp/scripts/fetch-tdlib.sh

      - name: Generate Xcode project
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Test on simulator (Android crypto fixtures via CryptoKit, TDLib link)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, items in devices.items() if "iOS" in runtime
                     for d in items if d["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          mkdir -p build
          xcodebuild \
            -project iosApp/TeleDrive.xcodeproj \
            -scheme TeleDrive \
            -destination "id=$UDID" \
            -derivedDataPath build/ios-sim \
            CODE_SIGNING_ALLOWED=NO \
            test > build/xcodebuild-test.log 2>&1 || { grep -E "error:|e: |XCTAssert|failed" build/xcodebuild-test.log | head -80; exit 1; }
          grep -E "Test Suite|Executed|\*\* TEST" build/xcodebuild-test.log | tail -20

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-logs
          path: build/*.log
          if-no-files-found: ignore
