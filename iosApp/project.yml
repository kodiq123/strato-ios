# XcodeGen spec: `xcodegen generate` (run in this folder, on macOS) writes Strato.xcodeproj.
# The Kotlin side is built by Gradle from the pre-build script, the standard KMP setup.
name: Strato
options:
  bundleIdPrefix: app.strato
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_BITCODE: NO

targets:
  Strato:
    type: application
    platform: iOS
    sources:
      - path: Strato
    dependencies:
      # Static TDLib (td_json_client), fetched by .github/workflows/ios.yml or
      # scripts/fetch-tdlib.sh into iosApp/Frameworks/. Static, so it is linked, not embedded.
      - framework: Frameworks/TDLibFramework.xcframework
        embed: false
    info:
      path: Strato/Info.plist
      properties:
        CFBundleDisplayName: Strato
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameDurationOnPhone: true
        # Downloads go to Documents; these show it in the Files app (On My iPhone › Strato).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - tg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.strato.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "StratoKit"
          - "-lc++"
          - "-lz"
          - "-lsqlite3"
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED being set to YES"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode --console=plain

  StratoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StratoTests
    dependencies:
      - target: Strato
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.strato.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Strato.app/Strato
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Strato:
    build:
      targets:
        Strato: all
        StratoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StratoTests
    archive:
      config: Release
